name: Verify MVP
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: seguimiento_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test-only-password
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://test:test-only-password@localhost:5432/seguimiento_test
      TEST_DATABASE_URL: postgresql+psycopg://test:test-only-password@localhost:5432/seguimiento_test
      SECRET_KEY: ci-only-secret-not-a-production-secret-123456789
      APP_ENV: test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-lock.txt
      - run: pip install -r requirements-lock.txt
      - run: alembic upgrade head
      - run: alembic check
      - run: pytest -q
      - run: ruff check app migrations
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test:i18n
      - run: npm run build
  browser:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: seguimiento_browser_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test-only-password
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://test:test-only-password@localhost:5432/seguimiento_browser_test
      SECRET_KEY: ci-only-secret-not-a-production-secret-123456789
      APP_ENV: demo
      DEMO_PASSWORD: ci-demo-password-not-for-real-use
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r backend/requirements-lock.txt
      - run: |
          cd backend
          alembic upgrade head
          python -m app.seed
          uvicorn app.main:app --host 127.0.0.1 --port 8000 --no-access-log &
      - run: npm ci && npm run build && npx playwright install --with-deps chromium
        working-directory: frontend
      - run: |
          npm run preview -- --port 5173 --host 127.0.0.1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5173/api/health; then break; fi
            sleep 1
          done
          npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: frontend/test-results/
